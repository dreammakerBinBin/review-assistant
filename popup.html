<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <title>Review Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="logo-text">Review Assistant</span>
      </div>
      <button id="btn-settings" class="icon-btn" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="reviews">评价</button>
      <button class="tab-btn" data-tab="templates">模板</button>
      <button class="tab-btn" data-tab="ai">AI</button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Tab: Reviews -->
      <section id="tab-reviews" class="tab-panel active">
        <!-- Filter Tags -->
        <div class="filter-tags">
          <button class="filter-tag active" data-filter="all">全部</button>
          <button class="filter-tag" data-filter="pending">待回复</button>
          <button class="filter-tag" data-filter="replied">已回复</button>
          <button class="filter-tag" data-filter="negative">差评</button>
        </div>

        <!-- Add Review Button -->
        <button id="btn-add-review" class="btn btn-primary btn-full">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          添加评价
        </button>

        <!-- Reviews List -->
        <div id="reviews-list" class="reviews-list">
          <!-- Empty state -->
          <div id="empty-state" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <p>暂无评价</p>
            <p class="empty-hint">点击上方按钮添加</p>
          </div>
        </div>
      </section>

      <!-- Tab: Templates -->
      <section id="tab-templates" class="tab-panel">
        <div id="templates-list" class="templates-list">
          <!-- Templates will be rendered here -->
        </div>
        <button id="btn-add-template" class="btn btn-secondary btn-full">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          新增模板
        </button>
      </section>

      <!-- Tab: AI Settings -->
      <section id="tab-ai" class="tab-panel">
        <div class="form-group">
          <label for="api-key">API Key</label>
          <input type="password" id="api-key" class="input" placeholder="输入 Claude API Key">
        </div>
        <button id="btn-test-api" class="btn btn-secondary btn-full">测试连接</button>
        <div id="api-status" class="api-status"></div>
      </section>
    </main>

    <!-- Status Bar -->
    <footer class="status-bar">
      <span id="status-text">就绪</span>
    </footer>
  </div>

  <!-- Add Review Modal -->
  <div id="modal-add-review" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>添加评价</h3>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="review-buyer">买家名称</label>
          <input type="text" id="review-buyer" class="input" placeholder="输入买家名称">
        </div>
        <div class="form-group">
          <label for="review-product">商品名称</label>
          <input type="text" id="review-product" class="input" placeholder="输入商品名称">
        </div>
        <div class="form-group">
          <label for="review-rating">星级</label>
          <div class="rating-select">
            <button class="rating-btn active" data-rating="5">5星</button>
            <button class="rating-btn" data-rating="4">4星</button>
            <button class="rating-btn" data-rating="3">3星</button>
            <button class="rating-btn" data-rating="2">2星</button>
            <button class="rating-btn" data-rating="1">1星</button>
          </div>
        </div>
        <div class="form-group">
          <label for="review-content">评价内容</label>
          <textarea id="review-content" class="input textarea" placeholder="输入评价内容"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal>取消</button>
        <button id="btn-save-review" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- Reply Modal -->
  <div id="modal-reply" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="reply-modal-title">回复评价</h3>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <div id="reply-review-info" class="reply-review-info">
          <!-- Review info will be inserted here -->
        </div>
        <div class="form-group">
          <label for="reply-content">回复内容</label>
          <textarea id="reply-content" class="input textarea" placeholder="输入回复内容或使用AI生成"></textarea>
        </div>
        <div class="reply-actions">
          <button id="btn-generate-ai" class="btn btn-secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
            </svg>
            AI 生成
          </button>
          <button id="btn-use-template" class="btn btn-secondary">使用模板</button>
        </div>
        <div id="templates-dropdown" class="templates-dropdown hidden">
          <!-- Templates dropdown will be rendered here -->
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-copy-reply" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          复制
        </button>
        <button id="btn-save-reply" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- Add Template Modal -->
  <div id="modal-add-template" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="template-modal-title">新增模板</h3>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="template-name">模板名称</label>
          <input type="text" id="template-name" class="input" placeholder="例如：感谢好评">
        </div>
        <div class="form-group">
          <label for="template-content">模板内容</label>
          <textarea id="template-content" class="input textarea" placeholder="支持变量：{buyerName}、{product}"></textarea>
        </div>
        <div class="form-group">
          <label for="template-category">分类</label>
          <select id="template-category" class="input">
            <option value="reply">回复模板</option>
            <option value="invite">邀请模板</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal>取消</button>
        <button id="btn-save-template" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="popup.js" type="module"></script>
</body>
</html>
